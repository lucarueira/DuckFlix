services:
  - type: web
    name: duckflix-together
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/together/clock
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://duckflix42.netlify.app
