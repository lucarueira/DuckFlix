name: DuckFlix Desktop for Windows

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:make
      - name: Create direct download asset
        shell: pwsh
        run: |
          $setup = Get-ChildItem out/make/squirrel.windows/x64 -Filter 'DuckFlix-*.Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Windows installer was not created.' }
          Rename-Item -LiteralPath $setup.FullName -NewName 'DuckFlix-Setup.exe'
      - uses: softprops/action-gh-release@v2
        with:
          name: DuckFlix Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: out/make/squirrel.windows/x64/*
